# Template for creating Kubernetes secrets
# Replace values and apply with: kubectl apply -f secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
type: Opaque
stringData:
  postgres-host: "your-postgres-server.postgres.database.azure.com"
  postgres-user: "pgadmin"
  postgres-password: "your-password"
  jwt-secret: "your-jwt-secret-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
type: Opaque
stringData:
  cosmos-endpoint: "https://your-cosmos-account.documents.azure.com:443/"
  cosmos-key: "your-cosmos-key"
  payment-function-url: "https://your-payment-function.azurewebsites.net/api/process-payment"
